[package]
name = "lionseed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A DNS seeder for the Bitcoin Knots BLAKE2b network"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync", "signal"] }
